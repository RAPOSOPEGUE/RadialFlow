<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: "Segoe UI", system-ui, sans-serif; user-select: none; cursor: default; }
  #wheel { position: relative; width: 360px; height: 360px; }
  .center { position: absolute; left: 150px; top: 150px; width: 60px; height: 60px; border-radius: 50%;
    background: rgba(20,20,28,.85); color: #9aa; font-size: 11px; display: flex;
    align-items: center; justify-content: center; text-align: center; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
  .slice { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%;
    background: rgba(20,20,28,.88); color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 11px; text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.45); transition: transform .08s, background .08s; }
  .slice .icon { font-size: 24px; line-height: 28px; }
  .slice.on { background: #3b82f6; transform: scale(1.18); }
</style>
</head>
<body>
<div id="wheel"><div class="center" id="center">solte p/ cancelar</div></div>
<script src="overlay.js"></script>
</body>
</html>
